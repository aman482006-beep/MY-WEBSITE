<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#17231d">
<title>Money, Markets &amp; Main Character Energy — 30 October 2026</title>
<style>
:root{color-scheme:light;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:#17231d;color:#f6f7f1}
*{box-sizing:border-box}
body{min-height:100vh;margin:0;display:grid;place-items:center;padding:28px;background:radial-gradient(circle at 50% 0%,#34483a 0,transparent 42%),#17231d}
main{width:min(100%,560px);padding:28px;border:1px solid #50604e;border-radius:18px;background:#202e25;box-shadow:0 18px 60px #0004}
.brand{color:#d8f36a;font-size:11px;font-weight:850;letter-spacing:.16em;text-transform:uppercase}
h1{margin:13px 0 8px;font-family:Georgia,serif;font-size:clamp(30px,7vw,42px);line-height:1.04;font-weight:500;letter-spacing:-.04em}
p{margin:0;color:#c6d1c7;font-size:14px;line-height:1.65}
.status{margin-top:19px;color:#d8f36a;font-size:12px;font-weight:750}
noscript{display:block;margin-top:18px;color:#ffd0bd}
</style>
</head>
<body>
<main>
<div class="brand">The Money Briefing · Finance × AI × Opportunity</div>
<h1>Money, Markets &amp; Main Character Energy.</h1>
<p>This preview is loading the exact standalone HTML edition published on 30 October 2026. The original document is embedded in this file and integrity-checked before it is displayed.</p>
<p id="preview-status" class="status" role="status" aria-live="polite">Preparing your newspaper…</p>
<noscript>This preview requires JavaScript to unpack the embedded newsletter edition.</noscript>
</main>
<script>
(() => {
  const compressedBase64 = "${match[1]}${remainder}";
  const expectedSha256 = "5d5067a4453b725414a826b64ebdb04df34d49be8f3332c7eebd1497da30c12a";
  const status = document.getElementById("preview-status");

  async function renderEdition() {
    if (typeof DecompressionStream === "undefined") {
      throw new Error("This browser does not support the compressed preview. Please open the preview in a recent version of Chrome, Edge, Firefox or Safari.");
    }

    const binary = atob(compressedBase64);
    const compressedBytes = Uint8Array.from(binary, (character) => character.charCodeAt(0));
    const decompressedStream = new Blob([compressedBytes]).stream().pipeThrough(new DecompressionStream("gzip"));
    const editionHtml = await new Response(decompressedStream).text();

    if (globalThis.crypto?.subtle) {
      const digestBuffer = await globalThis.crypto.subtle.digest("SHA-256", new TextEncoder().encode(editionHtml));
      const actualSha256 = Array.from(new Uint8Array(digestBuffer), (byte) => byte.toString(16).padStart(2, "0")).join("");
      if (actualSha256 !== expectedSha256) {
        throw new Error("The embedded edition failed its integrity check. The newsletter was not displayed.");
      }
    }

    document.open();
    document.write(editionHtml);
    document.close();
  }

  renderEdition().catch((error) => {
    status.textContent = error instanceof Error ? error.message : "The newspaper preview could not be loaded.";
    status.style.color = "#ffd0bd";
  });
})();
</script>
</body>
</html>
