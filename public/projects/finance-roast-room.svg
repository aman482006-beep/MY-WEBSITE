<g font-family="Manrope,Inter,Arial,sans-serif" text-anchor="middle">
 <circle cx="1660" cy="1102" r="12" fill="#0788cf"/><text x="1920" y="1120" font-size="38" font-weight="800" letter-spacing="8" fill="#667c96">THE ROOM IS OPEN</text>
 <text x="1920" y="1292" font-size="132" font-weight="750" letter-spacing="-4" fill="#111b2c">Bring a decision to the <tspan fill="url(#blue)">Roast Room</tspan></text>
 <path d="M2350 1320C2490 1295 2640 1293 2790 1318" stroke="#087fc8" stroke-width="15" fill="none" stroke-linecap="round"/>
 <text x="1920" y="1440" font-size="58" font-weight="450" fill="#50627a">In Claude Code, type the line below with your decision. The</text>
 <text x="1920" y="1518" font-size="58" font-weight="450" fill="#50627a">council shows up here and argues it out live.</text>
 <g filter="url(#tag)"><rect x="1480" y="1595" width="880" height="112" rx="32" fill="#f9fbfe" stroke="#c8d3e1" stroke-width="4"/><text x="1920" y="1668" font-size="48" font-weight="750" fill="#17243a">/roast-room should I ...</text></g>
