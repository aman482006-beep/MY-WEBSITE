<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="3840" height="2087" viewBox="0 0 3840 2087" role="img" aria-labelledby="title desc">
<title id="title">Finance Roast Room — Bring a decision to the Roast Room</title>
<desc id="desc">A clean 4K room hero with seven finance advisor portraits: Warren Buffett, Benjamin Graham, Charlie Munger, Peter Lynch, Howard Marks, Ray Dalio and Aswath Damodaran. The curved lower panel invites visitors to bring a decision and watch the council debate live.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbfcfe"/><stop offset=".56" stop-color="#f2f6fb"/><stop offset="1" stop-color="#e8f0f8"/></linearGradient>
 <linearGradient id="table" x1="0" y1="0" x2=".12" y2="1"><stop stop-color="#f2f6fb"/><stop offset=".58" stop-color="#e7edf5"/><stop offset="1" stop-color="#dbe4ef"/></linearGradient>
 <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0786cb"/><stop offset="1" stop-color="#1552a7"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#dbe8f6" stop-opacity="0"/></radialGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feGaussianBlur in="SourceAlpha" stdDeviation="20"/><feOffset dy="14"/><feComponentTransfer><feFuncA type="linear" slope=".18"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="tag" x="-20%" y="-30%" width="140%" height="170%"><feGaussianBlur in="SourceAlpha" stdDeviation="10"/><feOffset dy="6"/><feComponentTransfer><feFuncA type="linear" slope=".13"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <clipPath id="portraits"><rect width="3840" height="1090"/></clipPath>
</defs>
<rect width="3840" height="2087" fill="url(#bg)"/><ellipse cx="1920" cy="950" rx="1900" ry="920" fill="url(#glow)"/>
<g clip-path="url(#portraits)">
