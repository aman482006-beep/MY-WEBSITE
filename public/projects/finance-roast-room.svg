 <image xlink:href="https://raw.githubusercontent.com/aman482006-beep/Finance-Roast-Room/main/app/public/avatars/bgraham.webp" x="390" y="5" width="660" height="950" preserveAspectRatio="xMidYMax meet"/>
 <image xlink:href="https://raw.githubusercontent.com/aman482006-beep/Finance-Roast-Room/main/app/public/avatars/munger.webp" x="875" y="-35" width="650" height="950" preserveAspectRatio="xMidYMax meet"/>
 <image xlink:href="https://raw.githubusercontent.com/aman482006-beep/Finance-Roast-Room/main/app/public/avatars/lynch.webp" x="1390" y="-70" width="650" height="960" preserveAspectRatio="xMidYMax meet"/>
 <image xlink:href="https://raw.githubusercontent.com/aman482006-beep/Finance-Roast-Room/main/app/public/avatars/marks.webp" x="1890" y="-50" width="650" height="960" preserveAspectRatio="xMidYMax meet"/>
 <image xlink:href="https://raw.githubusercontent.com/aman482006-beep/Finance-Roast-Room/main/app/public/avatars/dalio.webp" x="2400" y="0" width="650" height="950" preserveAspectRatio="xMidYMax meet"/>
 <image xlink:href="https://raw.githubusercontent.com/aman482006-beep/Finance-Roast-Room/main/app/public/avatars/damodaran.webp" x="2800" y="90" width="760" height="950" preserveAspectRatio="xMidYMax meet"/>
</g>
