name: Deep browser QA across portfolio projects

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deep-project-qa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out portfolio and QA scripts
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser and workbook test libraries
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1 xlsx-js-style@1.2.0
          npx playwright install --with-deps chromium
      - name: Install LibreOffice and workbook inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libreoffice-calc
          python -m pip install --user openpyxl
      - name: Run live desktop/mobile interactions and download actual exports
        run: node scripts/deep-project-qa.mjs
      - name: Open and recalculate ModelForge exports in LibreOffice
        run: |
          mkdir -p project-qa-artifacts/recalculated
          libreoffice --headless -env:UserInstallation=file:///tmp/lo-modelforge-qa --convert-to xlsx --outdir project-qa-artifacts/recalculated project-qa-artifacts/ModelForge-All-Modules.xlsx
          libreoffice --headless -env:UserInstallation=file:///tmp/lo-modelforge-partial-qa --convert-to xlsx --outdir project-qa-artifacts/recalculated project-qa-artifacts/ModelForge-DCF-Only.xlsx
          python scripts/inspect-modelforge-export.py
      - name: Upload browser screenshots, timings and real Excel exports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deep-project-browser-qa-evidence
          path: project-qa-artifacts/
          if-no-files-found: warn
          retention-days: 14
