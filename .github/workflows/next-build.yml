name: Build and deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The build job only reads source. Deployment permissions are scoped to deploy.
permissions:
  contents: read

concurrency:
  group: github-pages-nextjs-export
  cancel-in-progress: true

jobs:
  build:
    name: Check and export the portfolio
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify the complete daily newspaper preview
        run: |
          cat public/resources/daily-newspaper-preview-2026-10-30.part1.txt \
              public/resources/daily-newspaper-preview-2026-10-30.part2.txt \
              public/resources/daily-newspaper-preview-2026-10-30.part3.txt \
              public/resources/daily-newspaper-preview-2026-10-30.part4.txt \
            | base64 --decode \
            | gzip --decompress --stdout > /tmp/daily-newspaper-preview.html
          echo "5d5067a4453b725414a826b64ebdb04df34d49be8f3332c7eebd1497da30c12a  /tmp/daily-newspaper-preview.html" | sha256sum --check
          grep -qi '^<!doctype html>' /tmp/daily-newspaper-preview.html
          grep -q 'Money, Markets & Main Character Energy' /tmp/daily-newspaper-preview.html

      - name: Run ESLint
        run: npm run lint

      - name: Check TypeScript
        run: npx tsc --noEmit

      # GitHub Pages serves static files only. Keep route.ts in the repository for
      # server deployments, but exclude it from this one static export build.
      - name: Exclude request-time API from static Pages build
        run: mv src/app/api/youtube/route.ts /tmp/youtube-route.ts

      # Only trusted pushes/manual deployments receive the API key. Pull-request
      # code is untrusted and must build using the public channel fallback.
      - name: Build static site (trusted deployment)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: npm run build
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Build static site (pull request, without secrets)
        if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
        run: npm run build

      - name: Add nojekyll marker for Next.js asset paths
        run: touch out/.nojekyll

      - name: Install Playwright for mobile smoke tests
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Capture 4K previews of the other projects
        run: node scripts/capture-project-previews.mjs

      - name: Test mobile touch navigation and buttons
        run: |
          node scripts/serve-static.mjs > /tmp/portfolio-static-server.log 2>&1 &
          echo $! > /tmp/portfolio-static-server.pid
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4173/MY-WEBSITE/ > /dev/null; then break; fi
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:4173/MY-WEBSITE/ > /dev/null
          node scripts/mobile-smoke.mjs

      - name: Audit responsive layouts across phone, tablet, laptop and desktop
        run: node scripts/responsive-layout-smoke.mjs

      - name: Upload static site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./out

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      deployments: write
      id-token: write
    steps:
      # A previous deploy-pages attempt can leave a deployment record stuck in
      # "in_progress". Retire only stale pending records before creating a new
      # Pages deployment; never touch the deployment for the current commit.
      - name: Clear stale Pages deployment locks
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPOSITORY}"
          headers=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          deployments="$(curl --fail --silent --show-error "${headers[@]}" "${api}/deployments?environment=github-pages&per_page=100")"
          while IFS= read -r deployment_id; do
            [[ -n "${deployment_id}" ]] || continue
            statuses="$(curl --fail --silent --show-error "${headers[@]}" "${api}/deployments/${deployment_id}/statuses?per_page=1")"
            state="$(jq -r '.[0].state // ""' <<< "${statuses}")"
            if [[ "${state}" == "in_progress" || "${state}" == "queued" || "${state}" == "pending" ]]; then
              curl --fail --silent --show-error -X POST "${headers[@]}" \
                "${api}/deployments/${deployment_id}/statuses" \
                -d '{"state":"failure","description":"Superseded by the latest verified Pages build; stale deployment lock cleared."}' >/dev/null
              echo "Retired stale Pages deployment ${deployment_id} (was ${state})."
            fi
          done < <(jq -r --arg sha "${CURRENT_SHA}" '.[] | select(.sha != $sha) | .id' <<< "${deployments}")

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
